[package]
name = "native_engine"
version = "0.1.0"
edition = "2021"
description = "Executable MVP of the native analytical data engine specified in docs/"

[dependencies]
thiserror = "2"
rayon = "1.10"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
blake3 = "1"

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "ndq"
path = "src/bin/ndq.rs"
