name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            verification
      - name: engine fmt
        run: cargo fmt --manifest-path engine/Cargo.toml --check
      - name: engine tests
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: engine clippy
        run: cargo clippy --locked --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - name: verification harness (23 tests)
        run: cargo test --locked --manifest-path verification/Cargo.toml
